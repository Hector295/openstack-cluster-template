apiVersion: baremetal.whitestack.com/v1
kind: ServerRole
metadata:
  name: dell41-{{ .Values.cluster.name }}
spec:
  storage:
  - vg_name: vg-root
    disks:
      - sda
    boot: uefi
    lvs:
      - name: lv-root
        size: "-1"
        fs_type: ext4
        mount: /
      - name: lv-logs
        size: 20GB
        fs_type: ext4
        mount: /var/log
      - name: lv-var-tmp
        size: 10GB
        fs_type: ext4
        mount: /var/tmp
  kernel_options:
    version: v6.5.0-28
  iso_options:
    image_name: ubuntu-22.04.4-live-server-amd64.iso
  users:
    - name: whitestack
      password: whitestack
      authorized_keys: 
      - "ssh-rsa  hector@hector"
      sudoers: "ALL=(ALL) NOPASSWD:ALL"
  timezone: America/Lima