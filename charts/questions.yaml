questions:
- variable: cluster.name
  default: mycluster
  description: "Specify the name of the cluster"
  label: "Cluster Name"
  required: true
  type: string
  group: "General"
- variable: cloudCredentialSecretName
  default:
  description: "cloudCredentialSecretName for provisioning cluster"
  label: "cloudCredential Name"
  type: cloudcredential
  group: "General"
- variable: cluster.config.kubernetesVersion
  default: v1.30.4+rke2r1
  description: "Specify Kubernetes version"
  label: "Kubernetes Version"
  type: enum
  required: true
  options:
  - v1.30.4+rke2r1
  - v1.29.8+rke2r1
  - v1.28.13+rke2r1
  - v1.27.16+rke2r2
  group: "General"
- variable: cluster.localClusterAuthEndpoint.enabled
  default: false
  label: "Local Auth endpoint"
  description: "Enable local auth access endpoint"
  type: boolean
  group: "Auth Access Endpoint"
  show_subquestion_if: true
  subquestions:
  - variable: cluster.localClusterAuthEndpoint.fqdn
    default:
    description: "Local auth access endpoint FQDN"
    label: "Auth Endpoint FQDN"
    type: hostname
    group: "Auth Access Endpoint"
  - variable: cluster.localClusterAuthEndpoint.caCerts
    default:
    label: "Auth Endpoint Cacerts"
    description: "Local auth access endpoint CACerts"
    type: multiline
    group: "Auth Access Endpoint"
- variable: addons.monitoring.enabled
  default: false
  label: "Enable monitoring"
  description: "Enable monitoring"
  type: boolean
  group: "Monitoring"
  show_subquestion_if: true
  subquestions:
  - variable: addons.monitoring.version
    default:
    label: "Monitoring Version"
    description: "Choose chart version of monitoring. If empty latest version will be installed"
    type: string
    group: "Monitoring"
- variable: addons.metallb.enabled
  default: false
  label: 'Enable MetalLB'
  description: 'Enable MetalLB'
  type: boolean
  group: 'MetalLB'
  show_subquestion_if: true
  subquestions:
    - variable: addons.metallb.version
      default: "0.14.5"
      label: 'Metallb Version'
      description: 'Only version 0.14.5 is available'
      type: string
      read_only: true
      group: 'MetalLB'
- variable: addons.openebs.enabled
  default: false
  label: 'Enable OpenEBS'
  description: 'Enable OpenEBS'
  type: boolean
  group: 'OpenEBS'
  show_subquestion_if: true
  subquestions:
    - variable: addons.openebs.version
      default: "4.1.1"
      label: 'OpenEBS Version'
      description: 'Only version 0.14.5 is available'
      type: string
      read_only: true
      group: 'OpenEBS'
- variable: addons.logging.enabled
  default: false
  label: 'Enable Rancher Logging'
  description: 'Enable Rancher Logging'
  type: boolean
  group: 'Logging'
  show_subquestion_if: true
- variable: addons.kubevirt.enabled
  default: false
  label: 'Enable KubeVirt'
  description: 'Enable KubeVirt'
  type: boolean
  group: 'KubeVirt'
- variable: cantidadObjetos
  label: "Número de objetos"
  type: int
  min: 0
  max: 10
  default: 1
  required: true
  description: "Especifica cuántos objetos quieres configurar"
  group: "Configuración de objetos"

# Luego crea preguntas repetibles basadas en ese número
- variable: "objeto[0].nombre"
  label: "Nombre del objeto 1"
  type: string
  required: true
  show_if: "cantidadObjetos>=1"
  group: "Configuración de objetos"
- variable: "objeto[0].valor"
  label: "Valor del objeto 1"
  type: string
  required: true
  show_if: "cantidadObjetos>=1"
  group: "Configuración de objetos"
- variable: "objeto[0].habilitado"
  label: "Habilitar objeto 1"
  type: boolean
  default: true
  show_if: "cantidadObjetos>=1"
  group: "Configuración de objetos"

# Y repite para cada objeto posible
- variable: "objeto[1].nombre"
  label: "Nombre del objeto 2"
  type: string
  required: true
  show_if: "cantidadObjetos>=2"
  group: "Configuración de objetos"
# ... y así sucesivamente