addons:
  kubevirt:
    enabled: true
  logging:
    enabled: true
    values: |-
      rke2:
        enabled: true
      logging:
        enableRecreateWorkloadOnImmutableFieldChange: true
        enabled: true
        clusterFlows:
          - name: all-logs
            spec:
              filters:
                - record_modifier:
                    records:
                      - cluster-name: cluster-rke2
              globalOutputRefs:
                - fluentd-forward
              match:
                - select: {}
        clusterOutputs:
          - name: fluentd-forward
            spec:
              forward:
                buffer:
                  flush_interval: 10s
                  retry_forever: false
                  retry_max_interval: '30'
                  type: file
                compress: gzip
                require_ack_response: false
                servers:
                  - host: 10.100.18.5
                    port: 24224
                tls_insecure_mode: true
      hostTailer:
        enabled: true
        fileTailers:
          - name: syslog
            path: /var/log/syslog
  longhorn:
    enabled: false
  metallb:
    enabled: true
    values: |-
      speaker:
        ignoreExcludeLB: true
    version: 0.14.5
  monitoring:
    enabled: true
    version: 104.1.0+up57.0.3
    values: |-
      alertmanager:
        enabled: false
      prometheus:
        thanosService:
          enabled: true
        prometheusSpec:
          externalLabels:
            k8s_cluster: cluster-rke2
          thanos:
            objstoreConfig:
              config:
                access_key: 4AYApsWxJV5pd81dWoqD
                bucket: rke2
                endpoint: 10.100.17.27:9000
                insecure: true
                secret_key: xmCh6780sHw93t54dPPfOLKrCAu0vpMp7U821cEQ
              type: S3
        thanosIngress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: GRPC
            nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
            nginx.ingress.kubernetes.io/grpc-backend: 'true'
            nginx.ingress.kubernetes.io/protocol: h2c
            nginx.ingress.kubernetes.io/proxy-read-timeout: '160'
          enabled: true
          hosts:
            - thanos.rke2.external.whitestack.com
          labels: {}
          nodePort: 30901
          paths:
            - /
          servicePort: 10901
          tls: null
          pathType: ImplementationSpecific
  openebs:
    enabled: true
    values: |-
      openebs-crds:
        csi:
          volumeSnapshots:
            enabled: false
      mayastor:
        storageClass:
          enabled: true
          nameSuffix: multiple-replica
          default: true
          allowVolumeExpansion: true
          parameters:
            protocol: nvmf
            repl: 3
    version: 4.1.1
cloudprovider: openstack
cluster:
  config:
    chartValues:
      rke2-calico: {}
    enableNetworkPolicy: false
    globalConfig:
      cloud_provider_name: ''
      cni: calico
      disable_cloud_controller: false
      disable_kube_proxy: false
      disable_scheduler: false
      etcd:
        disableSnapshots: true
        snapshotRetention: 5
        snapshotScheduleCron: 0 */5 * * *
      etcd_expose_metrics: false
      profile: ''
      protect_kernel_defaults: false
      secrets_encryption: false
      selinux: false
      systemDefaultRegistry: docker.io
      use_service_account_credentials: false
      write_kubeconfig_mode: 384
    localClusterAuthEndpoint:
      enabled: false
    registries:
      enabled: false
    upgradeStrategy:
      controlPlaneConcurrency: 10%
      controlPlaneDrainOptions:
        enabled: false
      workerConcurrency: 10%
      workerDrainOptions:
        enabled: false
    additionalManifests: |-
      ---
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: defaultpool
        namespace: metallb-system
      spec:
        addresses:
        - 10.100.18.80/32
        autoAssign: true
      ---
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: l2advertisement
        namespace: metallb-system
      spec:
        ipAddressPools:
        - defaultpool
      ---
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: rke2-ingress-nginx
        namespace: kube-system
      spec:
        valuesContent: |-
          controller:
            service:
              enabled: true
              type: LoadBalancer
              externalTrafficPolicy: Cluster
            publishService:
              enabled: true
            hostPort:
              enabled: false
      ---
      apiVersion: "openebs.io/v1beta2"
      kind: DiskPool
      metadata:
        name: pool-on-node-0
        namespace: openebs
      spec:
        node: node-0
        disks: ["/dev/vdb"]
      ---
      apiVersion: "openebs.io/v1beta2"
      kind: DiskPool
      metadata:
        name: pool-on-node-1
        namespace: openebs
      spec:
        node: node-1
        disks: ["/dev/vdb"]
      ---
      apiVersion: "openebs.io/v1beta2"
      kind: DiskPool
      metadata:
        name: pool-on-node-2
        namespace: openebs
      spec:
        node: node-2
        disks: ["/dev/vdb"]
      ---
      apiVersion: "openebs.io/v1beta2"
      kind: DiskPool
      metadata:
        name: pool-on-hp
        namespace: openebs
      spec:
        node: server-hector
        disks: ["/dev/vg-root/lv-docker"]
      ---
      apiVersion: "openebs.io/v1beta2"
      kind: DiskPool
      metadata:
        name: pool-on-dell
        namespace: openebs
      spec:
        node: server-dell41
        disks: ["/dev/vg-root/lv-var-tmp"]
      ---
      apiVersion: catalog.cattle.io/v1
      kind: ClusterRepo
      metadata:
        name: extra-charts
      spec:
        gitRepo: https://github.com/Hector295/rancher-extra-charts.git
      ---
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: ubuntu22
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
        source:
          http:
            url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
      ---
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: persistent-volume
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
      ---
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: test-vm-pvc
      spec:
        running: true
        template:
          spec:
            domain:
              cpu:
                cores: 2
              devices:
                disks:
                - name: image
                  disk:
                    bus: virtio
                - name: cloudinitdisk
                  cdrom:
                    bus: sata
                    readonly: true
                - name: additional-disk
                  disk:
                    bus: virtio          
                - name: empty-disk
                  disk:
                    bus: virtio
                - name: host-disk
                  disk:
                    bus: virtio
              resources:
                requests:
                  memory: 2048M
            volumes:
            - name: image
              persistentVolumeClaim:
                claimName: ubuntu22
            - name: cloudinitdisk
              cloudInitNoCloud:
                userData: |
                  #cloud-config
                  hostname: test-vm-pvc
                  disable_root: false
                  password: ubuntu
                  chpasswd: { expire: False }
                  ssh_pwauth: True
                  ssh_authorized_keys:
                  - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQCufPOpN3wRgzydWOn1Fq9ZjORGXlQaM3Pks1VeY0AZLUcSXWFb3arT9bYcmkyG+NNOXrPIaJIlnqwL8HJZ9BVa9rGwVDa6iMHe3YP9jsIRkgwOmYyM//uAt05A/Uq7gWFVAi//J5B5whUCAcNEP1ktL0vfPZKkljhWLbcCLhB5Dw== whitestack@server-dell41
            - name: additional-disk
              persistentVolumeClaim:
                claimName: persistent-volume
            - name: empty-disk
              emptyDisk:
                capacity: 1Gi
            - name: host-disk
              hostDisk:
                capacity: 1Gi
                path: /home/ubuntu/hostdisk.img
                type: DiskOrCreate

