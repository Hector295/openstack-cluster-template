    userDataFile: |
      #cloud-config
      package_update: true
      package_upgrade: true
      runcmd:
        - sudo apt-get update
        - sudo apt-get install -y linux-modules-extra-$(uname -r)
        - sudo modprobe nvme_tcp
        - echo "nvme_tcp" | sudo tee -a /etc/modules
        - echo 1024 | sudo tee /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages
        - echo "vm.nr_hugepages = 1024" | sudo tee -a /etc/sysctl.conf
        - echo "fs.inotify.max_user_watches=524288" | sudo tee -a /etc/sysctl.conf
        - echo "fs.inotify.max_user_instances=1024" | sudo tee -a /etc/sysctl.conf
        - echo "fs.inotify.max_queued_events=16384" | sudo tee -a /etc/sysctl.conf
        - sudo sysctl -p
        - sudo systemctl disable --now unattended-upgrades
        - sudo sed -i 's/^APT::Periodic::Update-Package-Lists "1"/APT::Periodic::Update-Package-Lists "0"/' /etc/apt/apt.conf.d/20auto-upgrades
        - sudo sed -i 's/^APT::Periodic::Unattended-Upgrade "1"/APT::Periodic::Unattended-Upgrade "0"/' /etc/apt/apt.conf.d/20auto-upgrades
